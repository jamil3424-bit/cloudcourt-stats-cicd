name: OIDC claim debug (temporary)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Print OIDC claims (not the token)
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          # pad to a valid base64url length
          case $(( ${#PAYLOAD} % 4 )) in
            2) PAYLOAD="$PAYLOAD==" ;;
            3) PAYLOAD="$PAYLOAD=" ;;
          esac

          echo "$PAYLOAD" | tr '_-' '/+' | base64 -d 2>/dev/null \
            | jq '{sub, aud, iss, repository, ref, workflow_ref}'
