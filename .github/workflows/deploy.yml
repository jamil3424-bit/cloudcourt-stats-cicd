name: Deploy CloudCourt Stats API

on:
  push:
    branches: [main]

# OIDC: the job mints a short-lived token and exchanges it for an AWS role.
# No long-lived access keys are stored in this repository.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO: cloudcourt-stats

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

  # This environment is applied for a demo and destroyed afterwards to hold
  # spend at zero. When nothing is running there is no deploy to perform —
  # that is an intentional state, not a broken pipeline, so the deploy job is
  # skipped rather than failed. It never reports a deploy that didn't happen.
  preflight:
    name: Check deploy target
    needs: test
    runs-on: ubuntu-latest

    outputs:
      deployable: ${{ steps.check.outputs.deployable }}
      instance_id: ${{ steps.check.outputs.instance_id }}

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: cloudcourt-preflight-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Look for a running instance
        id: check
        run: |
          set -euo pipefail

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=cloudcourt-server" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::No running cloudcourt-server instance. The environment is torn down (terraform destroy) to avoid idle cost. Image build and deploy skipped; run terraform apply to bring it back."
          else
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy target::$INSTANCE_ID"
          fi

  build-and-deploy:
    name: Build and deploy
    # The gate: a red test run stops the pipeline before anything is built or shipped.
    needs: [test, preflight]
    if: needs.preflight.outputs.deployable == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: cloudcourt-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Tagged with the commit SHA, never a floating tag — every deploy is
      # traceable to a commit and any prior SHA is a valid rollback target.
      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker buildx build --platform linux/arm64 \
            -t "$REGISTRY/$ECR_REPO:${{ github.sha }}" \
            --push .

      - name: Redeploy on EC2 via SSM
        id: deploy
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          INSTANCE_ID: ${{ needs.preflight.outputs.instance_id }}
        run: |
          set -euo pipefail

          echo "Deploying to $INSTANCE_ID"

          IMAGE="$REGISTRY/$ECR_REPO:$IMAGE_TAG"

          # Built with jq so the image reference is injected safely rather than
          # string-mashed into the JSON payload.
          PARAMS=$(jq -n --arg img "$IMAGE" --arg reg "$REGISTRY" --arg region "$AWS_REGION" '
            {commands: [
              ("aws ecr get-login-password --region " + $region +
               " | docker login --username AWS --password-stdin " + $reg),
              ("docker pull " + $img),
              "docker stop $(docker ps -q) 2>/dev/null || true",
              ("docker run -d -p 5000:5000 --restart unless-stopped " + $img),
              "sleep 5",
              "curl --fail --silent http://localhost:5000/health"
            ]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command: $COMMAND_ID"

      # send-command returns immediately; without this the job would go green
      # whether or not the container actually came up.
      - name: Verify deploy succeeded
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
          INSTANCE_ID: ${{ needs.preflight.outputs.instance_id }}
        run: |
          set -euo pipefail

          for _ in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")

            echo "status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deploy succeeded — /health returned 200."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "--- stdout ---"
                aws ssm get-command-invocation --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" --output text || true
                echo "--- stderr ---"
                aws ssm get-command-invocation --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" --output text || true
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "Timed out waiting for the deploy to finish."
          exit 1
